name: Feature idea
description: Something MarketMage could do for you.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API token, an Apify token, a webhook URL or any other secret here.** Issues are public.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you'd like to ask MarketMage, or what you'd like it to watch for you.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What you sell or plan to sell, and what you do today instead.
